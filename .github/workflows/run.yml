name: drizzle
on:
  schedule:
    # Minutes deliberately off the hour: GitHub delays :00 crons the most
    # (Nimbus measured 12:00 firing at 13:26). Local times shift one hour
    # later in winter (CST).
    - cron: '17 12 * * *'   # ~7:17 AM Dallas (CDT): morning board + settle yesterday
    - cron: '38 21 * * *'   # ~4:38 PM Dallas (CDT): capture run; tomorrow's rain market listed 14:00 UTC and the full 12z model cycle is in by ~20:12 UTC
    - cron: '7 2 * * *'     # ~9:07 PM Dallas (CDT): evening board; 18z GFS in and listing-hour thin OI has usually built
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: drizzle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test
        run: python test_drizzle.py
      - name: Generate boards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIZZLE_PAGE_URL: https://nfliegelman.github.io/drizzle/
        run: python drizzle.py
      - name: Commit updated boards + state
        run: |
          git config user.name  "drizzle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "update boards [skip ci]"
          git pull --rebase --autostash origin main
          git push
